services:
  cachescope:
    platform: linux/amd64
    build: .
    ports:
      - "127.0.0.1:9055:9055"
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/opt/cachescope/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9055/api/v1/experiment-templates', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
