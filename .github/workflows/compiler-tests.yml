name: Compiler and trace tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiler-tests:
    name: LLVM/MLIR 22.1.8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_DIR: ${{ github.workspace }}/build/compiler
      CACHESCOPE_BUILD_CACHE_MODEL: OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Ubuntu archive mirror
        run: |
          # cloud-init can restore ubuntu.sources while the job is running.
          echo 'http://mirrors.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt

      - name: Install pinned LLVM and MLIR packages
        run: scripts/install-llvm-dependencies.sh

      - name: Build, test, format-check and clang-tidy
        run: scripts/check.sh --with-lint

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"

      - name: Check pushed commit whitespace
        if: github.event_name != 'pull_request'
        env:
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "${HEAD_SHA}^" "${HEAD_SHA}"

      - name: Upload CTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-test-diagnostics
          path: |
            build/compiler/Testing/Temporary/LastTest.log
            build/compiler/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
