name: Compare with Cachegrind

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cachegrind-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cachegrind:
    name: Cachegrind (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Valgrind and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind gcc g++ python3

      - name: Compare L1D counters
        run: python3 scripts/compare_cachegrind.py --output "${RUNNER_TEMP}/cachegrind-results"

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cachegrind-comparison
          path: ${{ runner.temp }}/cachegrind-results/
          if-no-files-found: ignore
          retention-days: 7
