name: Cache simulator and runner tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            compiler: g++
            build-type: Release
            flags: -Wall -Wextra -Werror
          - name: Clang ASan UBSan
            compiler: clang++
            build-type: Debug
            flags: -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang

      - name: Configure runner, hierarchy and simulator
        run: >-
          cmake -S runner -B build/runner -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build/runner --parallel 2

      - name: Test
        run: ctest --test-dir build/runner --output-on-failure --no-tests=error
