schema: cachescope.cache.v1
name: demo-l1d-1k-2way
description: >-
  Deliberately small educational cache for short 16x16 live-demo traces.
  This configuration does not claim to model a real CPU.
addressing: normalized-model
initial_state: empty

levels:
  - name: L1D
    size_bytes: 1024
    line_size_bytes: 64
    associativity: 2
    replacement: lru
    write_policy: write_back
    allocation_policy: write_allocate
    prefetcher: none

buffers:
  A:
    base_address: 0x10000000
    alignment_bytes: 64
  B:
    base_address: 0x20000000
    alignment_bytes: 64
  C:
    base_address: 0x30000000
    alignment_bytes: 64
  src:
    base_address: 0x40000000
    alignment_bytes: 64
  dst:
    base_address: 0x50000000
    alignment_bytes: 64
